[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-optimizer"
version = "0.1.0"
description = "Context-window budget management: priority packing, pinned blocks, compression, rolling buffer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kooroush Masoumi", email = "kooroushmasoumi@gmail.com" }]
keywords = ["context-window", "llm", "prompt-engineering", "tokens"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
